    <style>
        html, body {
            background-color: transparent !important;
            background: rgba(0,0,0,0) !important;

        /* 这是新增/修改的样式 */
        #footer_bar {
            position: fixed;
            bottom: 10px;    /* 距离底部 10 像素 */
            left: 10px;      /* 距离左侧 10 像素 */
            padding: 5px 12px; /* 内边距，让文字离背景边缘有距离 */
            background: rgba(0, 0, 0, 0.6); /* 半透明黑色的“打码”背景 */
            border-radius: 4px; /* 圆角 */
            z-index: 10000;
            display: inline-block; /* 宽度随内容自适应 */
            box-shadow: 0 0 5px rgba(0,0,0,0.5); /* 阴影增强识别度 */
        }
    </style>
